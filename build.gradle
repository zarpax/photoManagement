plugins {
    id 'org.springframework.boot' version '1.5.3.RELEASE'
    id 'java'
}

group = 'juanan'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.7'
description = 'Api Rest for photo syncronization'

bootJar {
    baseName = 'server'
}

repositories {
    mavenCentral()
    maven { url 'http://maven.jahia.org/maven2/' }
    maven { url 'https://repo.spring.io/libs-release' }
    maven { url 'https://repo.adobe.com/nexus/content/repositories/public/' }
}

ext {
    json_fasterxml_version = '2.9.9'
}

dependencies {
    implementation 'org.im4java:im4java:1.4.0'
    implementation 'com.drewnoakes:metadata-extractor:2.10.1'
    implementation 'commons-io:commons-io:2.5'
    implementation 'org.aspectj:aspectjweaver:1.8.10'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    implementation 'org.apache.httpcomponents:httpclient:4.5.3'
    implementation 'org.apache.httpcomponents:httpmime:4.5.3'
    
    implementation 'javax.ws.rs:javax.ws.rs-api:2.0'
    
    runtimeOnly 'org.postgresql:postgresql:9.1-901-1.jdbc4'
    
    implementation 'commons-fileupload:commons-fileupload:1.2'
    
    implementation "com.fasterxml.jackson.core:jackson-core:${json_fasterxml_version}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${json_fasterxml_version}"
    
    implementation 'org.slf4j:slf4j-log4j12:1.7.7'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// To replicate <skipTests>true</skipTests>
tasks.withType(Test) {
    enabled = false
}

// To replicate the unusual resource configuration from pom.xml
sourceSets {
    main {
        resources {
            srcDir 'src/main/java'
            include '**/*.java'
        }
    }
}
